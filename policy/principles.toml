# Content policy and guards for this repository.
#
# One `[rule.<id>]` section per rule this repository declares for itself.
# Everything else arrives from the bundled sets named below, which are re-read
# from the binary on every run — a transcribed copy is a rule that has stopped
# moving.

# Who this repository belongs to, declared once for the whole policy.
# `unowned-push` refuses to run without it rather than deriving an allow-list
# from `origin`, which is tautological for the one remote most likely to be
# wrong.
owner = "HackingGate"

# This repository is PUBLIC, and saying so is what arms the three `private-names`
# guards rather than standing them down. Declared rather than looked up: a forge
# answers `unknown` with no token, and otherwise answers about the visibility
# this repository has TODAY, which is the one thing that changes on the day the
# answer matters. The set refuses to load without this line for that reason.
visibility = "public"

[inherit]
# Each set is named because taking it is a separate decision:
#
#   process-residue -- this crate's value is almost entirely in its comments:
#                      which behaviour exists because of which failure, and what
#                      breaks if it is "simplified". Those are the notes someone
#                      reads while deciding whether to change a line, and
#                      residue in them is read as part of the answer.
#   code-residue    -- the every-file tracker-reference scope, which 1.19.0
#                      moved out of process-residue under its own name: the
#                      tree already passed it under 1.18.0, so this keeps the
#                      check it had.
#   credentials     -- a public repository is the one place a pasted token is
#                      permanent, and this crate's subject is authorization, so
#                      its examples and tests are full of things shaped like
#                      real credentials.
#   unmanaged-pins  -- there is a CI workflow and a hook config here, which is
#                      where a version gets typed into a line no manifest holds.
#   hand-rolled-toolchain
#                   -- taken with nothing here for it to refuse, which is the
#                      point of taking it now rather than later. This tree
#                      declares its host tools in mise.toml and installs none of
#                      them by hand, so the set is armed against the NEXT
#                      hand-written installer rather than being adopted after
#                      one has already been written. A set inherited while it
#                      still has findings is one somebody argues with; a set
#                      inherited while the tree is clean is one nobody has to.
#   published-text  -- the two checkers below used to be written out here by
#                      hand, which is a rule that has stopped moving: the
#                      bundled one is re-read from the binary on every run and a
#                      copy is whatever was typed the day it was typed. Taking
#                      the set also brings the third rule the copy never had,
#                      `no-published-private-repo-names`, which reads the same
#                      owner list as the `private-names` guards and applies it to
#                      a pull-request body -- the seam that let the private
#                      organisation this crate was extracted from reach this
#                      repository's pull request in the first place.
sets = ["process-residue", "code-residue", "credentials", "unmanaged-pins", "hand-rolled-toolchain", "commit-message-residue", "invisible-characters", "unreviewed-history", "private-names", "published-text", "stale-pins", "unowned-push"]

# ---------------------------------------------------------------------------
# Guards -- what git is about to do.
#
# A content rule reads the tree and could run at any moment. A guard reads an
# ACT: the message about to be recorded, the identity about to be stamped on
# it, the range about to be pushed. Same `[rule.<id>]` section and the same one
# id namespace, so `git.hooks` is the whole registration -- which stage a guard
# fires at is decided here and not in .pre-commit-config.yaml.
# ---------------------------------------------------------------------------

# The three private-name guards are inherited from `private-names` and are not
# written out here. The copies that stood in this place matched the set rule for
# rule and hook for hook -- commit-msg, the staged diff, the tracked tree -- and
# their `visibility` and owner source are declared at the top of this file, which
# is the only place a rule arriving from a set can read them from.

# Pinned rather than derived. Deriving the owner from `origin` is tautological
# for the one remote most likely to be wrong: repointing origin also repoints
# the allow-list.
#
# This repository is PUBLIC by design, so the guard is not here to keep code in.
# It is here to keep pushes aimed at this account: a crate whose whole purpose
# is to be adopted elsewhere is one whose remote gets edited.
# `prevent-public-push` is inherited from `unowned-push` and is not written out
# here. The copy said `builtin`, `git.hooks = ["pre-push"]` and an `owner` the
# top of this file already declares -- nothing the set does not say.

# ---------------------------------------------------------------------------
# Checkers and shims -- what a command is about to publish.
#
# A git hook cannot see a pull-request body. `gh pr create` hands text straight
# to a public API without passing a single seam, and that is exactly how the
# private organisation this crate was extracted from reached this repository's
# pull request while every git-side guard was green.
#
# The three checkers arrive with the `published-text` set and are not written
# out here. Each is the binary consulting itself, which is the point -- the rule
# that judges a commit message and the rule that judges a pull-request body are
# the SAME rule, and a second implementation of it would agree until it did not.
# All three stand in front of `gh` and `git push`, and `git push` belongs there
# as much as `gh` does: a branch name goes onto a public forge in the ref list,
# in the pull request it suggests and in every notification, and pre-push is
# handed the refs but the guards that read them judge the DESTINATION and never
# the name. This crate is tracked by a private issue, so a reference that is
# correct in the tracker is a disclosure here.
# ---------------------------------------------------------------------------

# Subcommands are NAMED rather than pattern-matched. A shim that guesses which
# ones carry text is one release away from either missing a new one in silence
# or blocking one that never carried any, and only the first failure is visible.
[[shim]]
command = "gh"
match = [
  "pr:create", "pr:edit", "pr:comment", "pr:review",
  "issue:create", "issue:edit", "issue:comment",
  "release:create", "release:edit",
  # Five that carry text and stood behind nothing until uphold 1.8.0.
  # `pr:merge` publishes the merge commit message through flags this table
  # already names. The four close/reopen verbs publish through `--comment`,
  # which it cannot name here -- see the `[[shim.verbs]]` below.
  "pr:merge",
  "issue:close", "pr:close", "issue:reopen", "pr:reopen",
]
text_flags = ["-t", "--title", "-b", "--body", "-n", "--notes", "-d", "--description"]
file_flags = ["-F", "--body-file", "--notes-file"]
target_flags = ["-R", "--repo"]
# --fill takes the body from commit messages, which commit-msg already guarded
# on the way in. Checking it again would refuse text that is already published
# and cannot be edited, which teaches the wrong lesson about the guard.
skip_flags = ["--fill", "--fill-first", "--fill-verbose"]
web_flags = ["-w", "--web"]
editor_env = "GH_EDITOR"
target = "forge-repo"
scope = "public-target"

  # `-c` is not one flag. On `gh pr review` it is a BOOLEAN -- "Comment on a
  # pull request" -- and on `gh issue close` it TAKES A VALUE -- "Leave a
  # closing comment". Naming it above would make `gh pr review -c -b "body"`
  # read `-c` as consuming `-b`, so the body being published would go unread:
  # a false negative introduced into the seam that exists to prevent one.
  #
  # The list REPLACES the table's for these four verbs rather than adding to
  # it, which is why `--title` and `--body` are absent -- neither is a flag
  # these commands accept.
  [[shim.verbs]]
  match = ["issue:close", "pr:close", "issue:reopen", "pr:reopen"]
  text_flags = ["-c", "--comment"]


# git publishes text no git hook is in a position to read. A branch name goes
# onto a public forge in the ref list, in the pull request it suggests and in
# every notification; pre-push is handed the refs, but the guards that read them
# judge the DESTINATION and never the name. Its text is positional, so it needs
# its own collector rather than a fork of the shim above.
[[shim]]
command = "git"
match = ["push:*"]
target = "git-remote"
scope = "public-target"
collect = "git-refs"
