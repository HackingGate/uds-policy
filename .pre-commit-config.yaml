default_install_hook_types:
  - pre-commit
  - pre-merge-commit
  - pre-push
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # An explicit stage list, because the default is EVERY installed stage and
      # commit-msg is one of them. A runner hands a commit-msg hook the message
      # file with neither `files` nor `types` applied, so a YAML checker gets
      # asked whether an English sentence parses as YAML.
      - id: check-yaml
        stages: [pre-commit, pre-merge-commit, pre-push, manual]
      - id: check-toml
        stages: [pre-commit, pre-merge-commit, pre-push, manual]
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo
        args: [fmt, --check]
        pass_filenames: false
        files: \.rs$
      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: env
        args: ["RUSTFLAGS=-D warnings", cargo, clippy, --all-targets]
        pass_filenames: false
        files: \.rs$
      - id: cargo-test
        name: cargo test
        language: system
        entry: env
        args: ["RUSTFLAGS=-D warnings", cargo, test, --locked]
        pass_filenames: false
        files: \.rs$
        stages: [pre-push]
      - id: cargo-miri
        name: cargo miri test
        language: system
        entry: env
        args:
          [
            "MIRIFLAGS=-Zmiri-disable-isolation",
            "RUSTFLAGS=-D warnings",
            cargo,
            +nightly,
            miri,
            test,
          ]
        pass_filenames: false
        files: \.rs$
        stages: [manual]

  # The content policy, the guards and the declaration check. Every id is a
  # stage, and which rules have something to say at that stage is decided by
  # policy/principles.toml rather than here.
  - repo: https://github.com/HackingGate/uphold
    rev: v1.21.0
    hooks:
      # The declaration check, which the comment above named and this block did
      # not pin. Without it policy/upheld.toml is a file nothing reads: a claim
      # goes false the moment its rule is renamed, disabled or dropped from a
      # set, and the whole point of writing the claim down is that the tree
      # refuses rather than quietly enforcing one rule fewer.
      - id: uphold-check
      - id: uphold-scan
      - id: uphold-scan-text
      - id: uphold-guard
      - id: uphold-guard-commit-msg
      - id: uphold-guard-merge
      - id: uphold-guard-push
      - id: uphold-guard-manual
      # gitleaks over the staged diff, so a secret is refused before it is in
      # local history. It carries the credentials claim in policy/upheld.toml.
      - id: uphold-supply-chain-staged
      # The other five scanners reach the network, so they run over the pushed
      # range at pre-push, and over the whole tree at manual for CI, the only
      # run that sees an advisory against a dependency no commit touched.
      - id: uphold-supply-chain
      - id: uphold-supply-chain-all
