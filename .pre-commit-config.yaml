default_install_hook_types:
  - pre-commit
  - pre-merge-commit
  - pre-push
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # An explicit stage list, because the default is EVERY installed stage and
      # commit-msg is one of them. A runner hands a commit-msg hook the message
      # file with neither `files` nor `types` applied, so a YAML checker gets
      # asked whether an English sentence parses as YAML.
      - id: check-yaml
        stages: [pre-commit, pre-merge-commit, pre-push, manual]
      - id: check-toml
        stages: [pre-commit, pre-merge-commit, pre-push, manual]
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo
        args: [fmt, --check]
        pass_filenames: false
        files: \.rs$
      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: env
        args: ["RUSTFLAGS=-D warnings", cargo, clippy, --all-targets]
        pass_filenames: false
        files: \.rs$
      - id: cargo-test
        name: cargo test
        language: system
        entry: env
        args: ["RUSTFLAGS=-D warnings", cargo, test, --locked]
        pass_filenames: false
        files: \.rs$
      - id: cargo-miri
        name: cargo miri test
        language: system
        entry: env
        args:
          [
            "MIRIFLAGS=-Zmiri-disable-isolation",
            "RUSTFLAGS=-D warnings",
            cargo,
            +nightly,
            miri,
            test,
          ]
        pass_filenames: false
        files: \.rs$
      # The domain-freedom assertion, run as a check rather than left as a
      # promise in the README. This crate exists to be adopted by daemons that
      # agree about nothing except that they have a Unix socket, and a single
      # leaked identifier from any one consumer's problem domain is enough to
      # make the next adoption impossible — quietly, at review time, months
      # later.
      #
      # `examples/` and `tests/` are scanned too. Leaving them out was
      # backwards: the example is the first file a stranger reads, and a test
      # is where a real contract's vocabulary is most tempting to reach for, so
      # those are exactly the places a leak would be least visible.
      - id: no-domain-knowledge
        name: this crate knows nothing about what it serves
        language: system
        entry: sh
        args:
          - -c
          - |
            # `|| true` would have been wrong here. grep exits 1 for "no match"
            # and >1 for "the scan itself failed" -- an unreadable or renamed
            # src/, examples/ or tests/ -- and collapsing those two into success
            # is how a load-bearing guard reports a clean tree while looking at
            # nothing. Only exit 1 is a pass.
            leaked="$(grep -rinE 'vfio|libvirt|route.?config|network' src/ examples/ tests/)"
            status=$?
            if [ "$status" -gt 1 ]; then
              echo "the domain-knowledge scan could not run (grep exit $status);"
              echo "this guard looked at nothing, which is not the same as finding nothing."
              exit "$status"
            fi
            [ -z "$leaked" ] || {
              echo "domain knowledge leaked into src/, examples/ or tests/:"
              echo "$leaked"
              exit 1
            }
        pass_filenames: false
        files: ^(src|examples|tests)/.*\.rs$

  # ---------------------------------------------------------------------
  # The supply-chain gate: origin, advisories, typosquats and workflow
  # security, none of which a lockfile can answer by construction.
  #
  # ONE HOOK CALLING scripts/supply-chain.sh, not four calling the tools
  # directly. This crate is a single package and could perfectly well name the
  # four commands here -- but the same gate runs in six sibling workspaces that
  # are submodule trees and cannot, and a second implementation of the same
  # check is a second place for it to be wrong. The script is what CI runs too,
  # so a red hook and a red pipeline are the same program disagreeing with the
  # same tree rather than two programs disagreeing with each other.
  #
  # AT pre-push, NOT pre-commit. Three of the four checks fetch an advisory
  # database, and a hook that reaches the network on every `git commit` is one
  # that fails on a train and teaches people to pass --no-verify -- which
  # disables the whole set, not just the slow hook.
  # ---------------------------------------------------------------------
  - repo: local
    hooks:
      - id: supply-chain
        name: supply chain (origin, advisories, typosquats, workflows)
        language: system
        entry: mise
        args: [run, supply-chain]
        pass_filenames: false
        stages: [pre-push, manual]

  # The content policy, the guards and the declaration check. Every id is a
  # stage, and which rules have something to say at that stage is decided by
  # policy/principles.toml rather than here.
  - repo: https://github.com/HackingGate/uphold
    rev: v1.7.0
    hooks:
      # The declaration check, which the comment above named and this block did
      # not pin. Without it policy/upheld.toml is a file nothing reads: a claim
      # goes false the moment its rule is renamed, disabled or dropped from a
      # set, and the whole point of writing the claim down is that the tree
      # refuses rather than quietly enforcing one rule fewer.
      - id: uphold-check
      - id: uphold-scan
      - id: uphold-scan-text
      - id: uphold-guard
      - id: uphold-guard-commit-msg
      - id: uphold-guard-merge
      - id: uphold-guard-push
      - id: uphold-guard-manual
