name: CI

# A plain workflow rather than a reusable one from an organization `workflows`
# repository. Those live under other organizations and are private, so a call
# across the boundary needs credentials this repository deliberately does not
# have: it is public, its dependencies are all on crates.io, and its whole point
# is to be buildable by someone who is not us.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  prek:
    name: Prek
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Restore stable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-stable-v1
          save-if: "false"
      - name: Run prek (skip duplicate test hooks)
        uses: j178/prek-action@v2
        env:
          SKIP: cargo-test,cargo-miri

  rust:
    name: Rust (tests + build)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Restore stable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-stable-v1
      # `--locked` everywhere: Cargo.lock is committed, so a run that silently
      # resolved something else would not be testing what ships.
      - name: Build
        run: cargo build --locked --all-targets --verbose
      - name: Run tests
        run: cargo test --locked
      - name: Check the example still serves
        run: |
          set -euo pipefail
          socket="$(mktemp -u)"
          cargo run --locked --example echo-service -- "$socket" &
          example_pid=$!
          trap 'kill "$example_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            [ -S "$socket" ] && break
            sleep 0.2
          done
          curl --unix-socket "$socket" -sS --fail http://d/v1/status | tee /dev/stderr | grep -q '"healthy":true'

  miri:
    name: Miri
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (nightly + Miri)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: Restore nightly Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-nightly-miri-v1
      - name: Prepare Miri sysroot
        run: cargo +nightly miri setup
      # Everything that touches a socket is `cfg_attr(miri, ignore)`d, which is
      # most of this crate. What is left — the parsers, the liveness arithmetic,
      # the sanitisers — is exactly the part where a Miri finding would be a
      # real one.
      - name: Run Miri tests
        run: cargo +nightly miri test

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the MSRV this crate declares
        id: msrv
        run: |
          version="$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the declared toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Build against the MSRV
        run: cargo build --locked --all-targets

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs:
      - prek
      - rust
      - miri
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Restore stable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-stable-v1
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --html --output-dir target/llvm-cov/html
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: llvm-cov-html
          path: target/llvm-cov/html
