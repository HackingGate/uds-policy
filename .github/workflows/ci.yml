name: CI

# A plain workflow rather than a reusable one from an organization `workflows`
# repository. Those live under other organizations and are private, so a call
# across the boundary needs credentials this repository deliberately does not
# have: it is public, its dependencies are all on crates.io, and its whole point
# is to be buildable by someone who is not us.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Read-only by default, at workflow scope so every job inherits it and a job
# added later does not quietly start from the repository default. These jobs
# build and run repository-controlled code -- the example runs its own self-test
# -- and none of them writes anything back through the API.
permissions:
  contents: read

jobs:
  prek:
    name: Prek
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Restore stable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-stable-v1
          save-if: "false"
      - name: Run prek (skip duplicate test hooks)
        uses: j178/prek-action@v2
        env:
          SKIP: cargo-test,cargo-miri

  rust:
    name: Rust (tests + build)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Restore stable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-stable-v1
      # `--locked` everywhere: Cargo.lock is committed, so a run that silently
      # resolved something else would not be testing what ships.
      - name: Build
        run: cargo build --locked --all-targets --verbose
      - name: Run tests
        run: cargo test --locked
      # The example drives itself: it binds, connects to its own socket from a
      # thread, and exits non-zero if the exchange did not happen. This step
      # used to speak HTTP with `curl`, which only worked because the crate
      # owned a wire format — the thing it deliberately no longer does. The
      # self-test keeps the guarantee that matters (the example actually runs,
      # rather than merely compiling) without a protocol or a client on the
      # runner.
      - name: Check the example still runs
        run: cargo run --locked --example gatekeeper -- --self-test

  miri:
    name: Miri
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain (nightly + Miri)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri, rust-src
      - name: Restore nightly Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-nightly-miri-v1
      - name: Prepare Miri sysroot
        run: cargo +nightly miri setup
      # Everything that touches a socket is `cfg_attr(miri, ignore)`d, which is
      # most of this crate. What is left — the parsers, the liveness arithmetic,
      # the sanitisers — is exactly the part where a Miri finding would be a
      # real one.
      - name: Run Miri tests
        run: cargo +nightly miri test

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the MSRV this crate declares
        id: msrv
        run: |
          version="$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the declared toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Build against the MSRV
        run: cargo build --locked --all-targets

  # The checks that ask about a dependency's ORIGIN and REPUTATION rather than
  # its version. Everything else in this file proves the tree builds and passes;
  # `--locked` even proves it is the tree that was reviewed. None of that would
  # notice a crate that resolved perfectly, checksummed perfectly, and was
  # reported malicious last week.
  #
  # Driven through mise rather than four separate marketplace actions, so the
  # runner and a contributor's machine get the same four binaries at the same
  # versions from the same file. Four actions would also mean four more `uses:`
  # lines to keep honest, which is the problem one of these jobs exists to find.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the declared toolchain
        uses: jdx/mise-action@v4
      # The same script the pre-push hook runs, so a red pipeline and a red
      # hook are one program disagreeing with the tree rather than two.
      - name: Run the supply-chain checks
        run: mise run supply-chain

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs:
      - prek
      - rust
      - miri
      - supply-chain
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Restore stable Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-stable-v1
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --html --output-dir target/llvm-cov/html
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: llvm-cov-html
          path: target/llvm-cov/html
